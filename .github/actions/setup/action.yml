name: setup
description: >
  Everything a job needs before it can run the suite or build the binary:
  system libs, the jolt compiler, the C kernels, the encoder checkpoints and the
  prepared data/ directory.

inputs:
  target:
    description: jolt release asset target (aarch64-macos or x86_64-linux)
    required: true
  checkpoints-revision:
    # The golden traces and the CRCs in golden/*prepare.edn were dumped from
    # the checkpoints at this revision of convaiinnovations/laya (the first one
    # that bundles typed-decisions/ and multilingual/; the english files are
    # byte-identical to the 7c76b62 revision golden/ was first dumped from).
    # The suite pins to it, not to main: a newer upload would change the
    # checksums and every parity test with them.
    description: convaiinnovations/laya git revision to fetch
    default: c5d78730f3493e4fe16d61507ef4b78eef7318cf
  jolt-pin:
    description: jolt release tag to use instead of the latest one
    default: ''

runs:
  using: composite
  steps:
    # The matmul dlopens OpenBLAS at runtime (see :jolt/native in
    # deps.edn); macOS has the Accelerate framework. The -dev package also
    # installs the unversioned .so symlink, the last fallback in deps.edn.
    # uuid-dev is for `jolt build`: the Chez launcher links -luuid on linux.
    - name: System deps (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libopenblas-dev uuid-dev

    # Latest release by default; the JOLT_PIN repository variable overrides
    # without a commit. Echoed so the log records which compiler built what.
    - name: Resolve jolt version
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        JOLT_PIN: ${{ inputs.jolt-pin }}
      run: |
        if [ -n "$JOLT_PIN" ]; then
          ver="$JOLT_PIN"
          echo "jolt: PINNED to $ver via the JOLT_PIN repository variable"
        else
          ver=$(gh api repos/jolt-lang/jolt/releases/latest --jq .tag_name)
          [ -n "$ver" ] && [ "$ver" != "null" ] || { echo "could not resolve latest jolt"; exit 1; }
          echo "jolt: latest release is $ver"
        fi
        echo "JOLT_VERSION=$ver" >> "$GITHUB_ENV"

    - name: Install jolt
      shell: bash
      run: |
        url="https://github.com/jolt-lang/jolt/releases/download/${JOLT_VERSION}/jolt-${JOLT_VERSION}-${{ inputs.target }}.tar.gz"
        curl -fsSL -o jolt.tar.gz "$url"
        mkdir -p "$HOME/.jolt-dist"
        tar xzf jolt.tar.gz -C "$HOME/.jolt-dist" --strip-components=1
        rm jolt.tar.gz
        echo "$HOME/.jolt-dist" >> "$GITHUB_PATH"

    - name: jolt version
      shell: bash
      run: jolt --version

    - name: Build kernels
      shell: bash
      run: jolt kernels

    # 2.3 GB from the Hub: the english root plus the typed-decisions and
    # multilingual subfolders. The cache key is the revision, so a bump above
    # refetches once and every OS shares the one entry (the files are the
    # same bytes everywhere).
    # -v2 is the layout: bump it when the file list below changes, or a hit on
    # an older entry serves a directory missing the new files (it did, when
    # tokenizer_config.json and multilingual/ were added)
    - name: Cache the encoder checkpoints
      id: checkpoint
      uses: actions/cache@v4
      with:
        path: ~/laya
        key: laya-checkpoint-${{ inputs.checkpoints-revision }}-v2

    # fetches whatever the cache did not have, then checks every model file
    - name: Fetch the encoder checkpoints (convaiinnovations/laya)
      shell: bash
      env:
        REV: ${{ inputs.checkpoints-revision }}
        # sha256 of each model.safetensors at that revision (its LFS blob id)
        SHA256_ENGLISH: 891102d372688fc2a094dac56a384bc537b87c63f21f9f3dac0be2b7cbc8d86c
        SHA256_TYPED_DECISIONS: 4fa56de72383a9d3efa9cfa78955733c81b9fc8067a587ca4beb82c78107a24e
        SHA256_MULTILINGUAL: 9d628fd971b700382ac6f65920a86f149777b2e748e0c955fb3b19695aa8f204
      run: |
        base="https://huggingface.co/convaiinnovations/laya/resolve/${REV}"
        fetch() {  # fetch <subdir-or-empty> : the five files jolt prepare reads
          local sub="$1" dir="$HOME/laya${1:+/$1}"
          mkdir -p "$dir/tokenizer" "$dir/encoder"
          for f in model.safetensors tokenizer/tokenizer.json tokenizer/tokenizer_config.json encoder/config.json rl_agent_config.json; do
            [ -s "$dir/$f" ] || curl -fsSL --retry 3 -o "$dir/$f" "$base/${sub:+$sub/}$f"
          done
        }
        fetch ""
        fetch typed-decisions
        fetch multilingual
        echo "$SHA256_ENGLISH  $HOME/laya/model.safetensors" | shasum -a 256 -c -
        echo "$SHA256_TYPED_DECISIONS  $HOME/laya/typed-decisions/model.safetensors" | shasum -a 256 -c -
        echo "$SHA256_MULTILINGUAL  $HOME/laya/multilingual/model.safetensors" | shasum -a 256 -c -

    # every checkpoint under LEV_CHECKPOINTS: data/, data/typed-decisions, data/multilingual
    - name: Prepare data/
      shell: bash
      run: |
        echo "LEV_CHECKPOINTS=$HOME/laya" >> "$GITHUB_ENV"
        LEV_CHECKPOINTS="$HOME/laya" jolt prepare
